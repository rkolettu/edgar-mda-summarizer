name: Validate ingest heartbeat
on:
  push:
    branches: [codex/ingest-heartbeat-validation]
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Validate heartbeat and model persistence
        working-directory: backend
        run: python -m pytest tests/test_research_heartbeat.py tests/test_research_interpret.py tests/test_research_ingest.py tests/test_research_audit.py --tb=short
  ingest:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SEC_USER_AGENT" ]; then
            echo "::notice::Add the DATABASE_URL and SEC_USER_AGENT repository secrets to enable ingestion."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ingest
        if: steps.config.outputs.ready == 'true'
        working-directory: backend
        env:
          TICKERS: ${{ inputs.tickers }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          INTERPRET=""
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$MISTRAL_API_KEY" ]; then INTERPRET="--interpret"; fi
          if [ -n "$TICKERS" ]; then
            python -m research.ingest $TICKERS $FORCE $INTERPRET
          else
            python -m research.ingest --watchlist $FORCE $INTERPRET
          fi
